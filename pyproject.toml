[project]
name = "blackbox"
version = "1.0.0"
description = "A Python module for parallel optimization of expensive black-box functions"
authors = [{ name = "Paul Knysh" }]
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
keywords = ["optimization", "black-box", "surrogate", "rbf"]
urls = { Homepage = "https://github.com/paulknysh/blackbox", Source = "https://github.com/paulknysh/blackbox" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blackbox"]
